# Cargo configuration for the Fineract Rust migration.
#
# sqlx offline mode: compile-time-checked queries require `.sqlx` query
# verification files, generated by `cargo sqlx` against a scratch database.
# Set SQLX_OFFLINE=1 (e.g. in CI) to prevent sqlx from connecting at build
# time. The `.sqlx/` directory is checked in once query checking is enabled
# (Phase 4).

[build]

[net]
# Prefer the local cache; do not fall back to the network for crates already
# vendored in the lockfile in air-gapped CI environments.
offline = false
