[workspace]
resolver = "2"
members = [
    "rust/fineract-core",
    "rust/fineract-validation",
    "rust/fineract-security",
    "rust/fineract-persistence",
    "rust/fineract-command",
    "rust/fineract-provider",
    "rust/fineract-tests",
    "rust/fineract-branch",
    "rust/fineract-charge",
    "rust/fineract-rates",
    "rust/fineract-tax",
    "rust/fineract-document",
    "rust/fineract-investor",
    "rust/fineract-cob",
    "rust/fineract-savings",
    "rust/fineract-accounting",
    "rust/fineract-loan",
    "rust/fineract-progressive-loan",
    "rust/fineract-working-capital-loan",
    "rust/fineract-loan-origination",
    "rust/fineract-client",
    "rust/fineract-staff",
    "rust/fineract-holiday",
    "rust/fineract-code",
    "rust/fineract-currency",
    "rust/fineract-loan-product",
    "rust/fineract-savings-product",
]

[workspace.dependencies]
# --- Foundational ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.3", features = ["serde"] }
async-trait = "0.1"

# --- Database (sqlx, compile-time checked, parameterized only) ---
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "uuid",
] }

# --- Observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- Secrets & cryptography ---
secrecy = { version = "0.8" }
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
rand = { version = "0.8", features = ["getrandom"] }
ring = "0.17"
argon2 = "0.5"
blake3 = "1.5"
jsonwebtoken = "9"

# --- Web (Axum) ---
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = "0.5"
http = "1"

# --- Validation ---
validator = { version = "0.16", features = ["derive"] }

# --- Testing ---
proptest = "1.0"
insta = "1"
criterion = "0.5"
mockall = "0.11"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 1
debug = 1
