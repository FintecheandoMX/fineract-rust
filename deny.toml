# cargo-deny configuration for the Fineract Rust migration.
# Enforced on every CI run: any violation fails the build.

# Licenses: Apache-2.0 and MIT preferred; also allow other OSI/FSF-free
# licenses used by transitive dependencies (all are open-source, vetted).
[licenses]
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CDLA-Permissive-2.0"]

# Vulnerabilities / supply-chain hygiene: fail on any unmaintained, yanked,
# or unsound advisory. Regular vulnerability advisories are denied by default.
# NOTE: RUSTSEC-2023-0071 (rsa 0.9.10 Marvin Attack) is a lockfile-only
# orphan reachable solely via the unused sqlx-mysql backend; this project is
# PostgreSQL-only and rsa is never compiled or linked. It is handled in CI
# via `cargo audit --ignore RUSTSEC-2023-0071` and documented in
# SECURITY-THREAT-MODEL.md.
[advisories]
unmaintained = "all"
yanked = "deny"
unsound = "all"

# Multiple versions of the same crate increase supply-chain surface.
# Denied by default; the skips below are documented, justified exceptions:
# - getrandom/rand_core/hashbrown/syn/thiserror/thiserror-impl: newer
#   versions are pulled in only by the proptest dev-dependency chain and are
#   not part of the production artifact.
# - windows-*/windows-sys/windows-targets: platform-specific crates; on a
#   Linux build only one variant is actually compiled.
[bans]
multiple-versions = "deny"
skip = [
  "getrandom", "rand_core", "hashbrown", "syn", "thiserror", "thiserror-impl",
  "redox_syscall",
  "windows-sys", "windows-targets",
  "windows_aarch64_gnullvm", "windows_aarch64_msvc",
  "windows_i686_gnu", "windows_i686_msvc",
  "windows_x86_64_gnu", "windows_x86_64_gnullvm", "windows_x86_64_msvc",
  "base64", "tower-http", "webpki-roots",
]
