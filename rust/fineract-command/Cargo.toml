[package]
name = "fineract-command"
version = "0.1.0"
edition = "2021"
description = "Fineract Rust command pipeline (CQRS): command dispatch, handlers, idempotency, audit."
license = "Apache-2.0"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = "1"
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
async-trait = "0.1"

[dependencies.fineract-core]
path = "../fineract-core"

[dependencies.fineract-security]
path = "../fineract-security"

[dependencies.fineract-persistence]
path = "../fineract-persistence"

[dev-dependencies]
proptest = { workspace = true }
secrecy = { workspace = true }
