[package]
name = "fineract-core"
version = "0.1.0"
edition = "2021"
description = "Apache Fineract Rust migration — foundational types, typed IDs, money, errors."
license = "Apache-2.0"

[features]
default = []
# Enable sqlx Type/Encode/Decode implementations for the typed ID newtypes.
sqlx = ["dep:sqlx"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror = "1"
rust_decimal = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }

[dependencies.sqlx]
workspace = true
optional = true
default-features = false
features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"]

[dev-dependencies]
proptest = { workspace = true }
